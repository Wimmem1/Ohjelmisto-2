<!DOCTYPE html>
<html>
    <head>

        <link rel="stylesheet" href="page_styles.css"> <!-- Tässä linkataan css tiedosto-->

        <!-- Tässä on head tag-->
         <title>Sivun otsikko</title> <!-- Tässä esimerkki otsikosta-->
         <style>
            body {
                background-color: linen;

            }
            h1 {
                color: maroon;
                margin-left: 40px;
            }
         </style>
         
         
    </head>
    <body>
        <h1>Tämä on otsikko</h1>  <!-- h1 Tarkoittaa otsikkoa-->
        <p>Tämä on kappale.</p>     <!-- p tarkoittaa kappaletta -->
        <a href="https://www.w3schools.com"> Siirry W3Schools</a>
        <img src="https://i.redd.it/4ig97vv85vjb1.png" alt="Kurpitsa" />

        <table class="oma_taulukko"> <!-- Tässä esimerkki siitä kuinka luodaan taulukko-->  <!-- class:lla luodaan custom atribuutti, jolla voidaan muokata tyyliä omassa css tiedostossa -->
            <tr> <!-- <tr> tarkoittaa table row ("Rivejä")-->
                <th>Etunimi</th>  <!-- <th> tarkoittaa table header "Taulun sisältö"-->
                <th>Sukunimi</th> <!-- <th> luo lihavoidun tekstin--> 
                <th>Ikä</th>
            </tr>
            <tr>
                <td>Jill</td> <!--td ei luo liahvoitua tekstiä -->
                <td>Smith</td> <!-- td tarkoittaa "table data cells" -->
                <td>50</td>
            </tr>
            <tr>
                <td>ES</td>
                <td>Jonne</td>
                <td>99</td>
            </tr>
            <tr>
                <th>Moi</th>
                <th>Testi</th>
                    <td>Testi2</td>
            </tr>
        </table>

        <ul> <!-- Lista esimerkkki-->  <!-- "Unordered list"-->
            <li>Kahvi</li> <!-- List -->
            <li>Tee</li>
            <li>Maito</li>
        </ul>
        <ol> <!-- Ordered list-->
            <li>Kahvi</li> 
            <li>Tee</li>
            <li>Maito</li>
        </ol>
        <dl>  <!-- Description list-->
            <dt>Kahvi</dt> <!-- description details-->
            <dd>- musta kuuma juoma</dd>
            <dt>Maito</dt>
            <dd>- Valkoinen kylmä juoma</dd>
        </dl>


    </body>
<html>
